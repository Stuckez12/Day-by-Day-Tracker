name: Create New Release

on:
  pull_request:
    branches:
      - main
    types: [closed]

jobs:
  create_release:
    if: github.event.pull_request.merged == true

    name: Create New Release
    runs-on: ubuntu-latest

    steps:
      - name: Get PR Label
        id: label
        uses: zwaldowski/match-label-action@v4
        with:
          allowed: major,minor,patch

      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Semantic Tag Bump
        id: next_version
        uses: zwaldowski/semver-release-action@v3
        with:
          bump: ${{ steps.label.outputs.match }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create New Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.next_version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          generateReleaseNotesPreviousTag: ${{ steps.next_version.outputs.previous_version }}
