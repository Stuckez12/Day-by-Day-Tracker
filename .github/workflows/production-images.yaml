name: Production Ready Test

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Application
        run: docker compose -f docker-compose.prod-test.yaml up -d

      - name: Wait Time
        run: sleep 12

      - name: Docker
        run: |
          docker logs day-by-day-tracker-api-1

      - name: Upgrade Database
        run:
          - docker compose -f docker-compose.prod-test.yaml exec api alembic -c /api/alembic.ini upgrade head
          - docker compose -f docker-compose.prod-test.yaml exec api alembic -c /api/alembic-backup.ini upgrade head

      - name: Docker
        run: |
          docker logs day-by-day-tracker-api-1

      - name: Frontend Check
        run: |
          curl --fail http://localhost:8080/login

      - name: API Check
        run: |
          curl --fail http://localhost:8080/api/docs

      - name: Celery Task Check
        run: |
          curl --fail http://localhost:8080/api/v1/execute/task/simulate
