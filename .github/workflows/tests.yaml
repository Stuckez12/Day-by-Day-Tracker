name: Backend API CI

on:
  workflow_dispatch:
  push:
  release:
    types: [published]

jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Formatting
        uses: astral-sh/ruff-action@v3
        with:
          version: latest
          args: format src --check --config pyproject.toml

      - name: Linting
        uses: astral-sh/ruff-action@v3
        with:
          args: check src --config pyproject.toml

  type-checker:
    needs: formatter
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Sync Packages
        run: |
          pip install uv
          uv sync

      - name: Run ty
        run: |
          uv run ty check ./src

  tests:
    needs: type-checker
    runs-on: ubuntu-latest

    env:
      APP_ENV: test

      # Database
      DATABASE_USERNAME: testing
      DATABASE_PASSWORD: testing
      DATABASE_HOST: localhost
      DATABASE_PORT: 5435
      DATABASE_DB_NAME: test_dbdt

      # Celery
      REDIS_URL: redis://localhost:6379

      # Backup file paths
      EXTERNAL_BACKUP_PATH: ${{ github.workspace }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ${{ env.DATABASE_USERNAME }}
          POSTGRES_PASSWORD: ${{ env.DATABASE_PASSWORD }}
          POSTGRES_DB: ${{ env.DATABASE_DB_NAME }}
        ports:
          - 5435:5432
        options: >-
          --health-cmd="pg_isready -U testing"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl gnupg

          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/pgdg.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17

          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Verify PostgreSQL client
        run: |
          which pg_dump
          pg_dump --version

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 0.9.11

      - name: Sync Packages
        run: |
          uv sync

      - name: Alembic Checks
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

      - name: Tests Execution
        run: uv run pytest -vv -s
